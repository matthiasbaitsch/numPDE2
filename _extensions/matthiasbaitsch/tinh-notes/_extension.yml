title: tinh-notes
author: Matthias Baitsch
version: 0.2.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    html:
      lang: de
      toc: true
      toc-depth: 4
      css:
        - tinh-notes.css
      default-image-extension: svg
      filters:
        - toc-logo.lua
    pdf:
      lang: de
      filters:
        - latex-environment.lua
      commands: [neuerbegriff, ja, nein]
      environments: [beispiel]
      include-in-header:
        - tinh-notes.tex
      include-after-body:
        text: |
          \printindex
      default-image-extension: pdf
