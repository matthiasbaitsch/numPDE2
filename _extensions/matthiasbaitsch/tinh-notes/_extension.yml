title: tinh-notes
author: Matthias Baitsch
version: 0.5.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    common:
      # Makros aus tinh-macros (\SI, \R, ...), Bilder zentrieren aus tinh-common
      filters:
        - ../tinh-macros/macros.lua
        - ../tinh-common/center-images.lua
      fig-align: center
      number-depth: 3
    html:
      lang: de
      toc: true
      toc-depth: 4
      css:
        - tinh-notes.css
      default-image-extension: svg
    pdf:
      lang: de
      # eingebettet mit quarto add quarto-ext/latex-environment --embed tinh-notes
      filters:
        - latex-environment
      commands: [neuerbegriff, ja, nein]
      include-in-header:
        - tinh-notes.tex
      include-after-body:
        text: |
          \printindex
      default-image-extension: pdf
