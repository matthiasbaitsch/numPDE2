title: tinh-slides
author: Matthias Baitsch
version: 0.16.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    common:
      # Makros aus tinh-macros (\SI, \R, ...), Bilder zentrieren aus tinh-common
      filters:
        - ../tinh-macros/macros.lua
        - path: ../tinh-common/center-images.lua
          at: pre-ast
      fig-align: center
    revealjs:
      # Quartos Logo aus, stattdessen logo.lua
      logo: false
      filters:
        - logo.lua
      lang: de
      overview: true
      slide-number: c/t
      transition: fade
      transition-speed: slow
      code-line-numbers: false
      html-math-method:
        method: mathjax
        # MathJax 4 mit Latin Modern (dünner als die Voreinstellung mathjax-newcm)
        url: "https://cdn.jsdelivr.net/npm/@mathjax/mathjax-modern-font@4/tex-mml-chtml-mathjax-modern.js"
      theme:
        - slides.scss
    typst:
      # Quartos Brand-Logo (page.typ), statt der Voreinstellung für A4 klein unten rechts
      # (Seitenzahl links, siehe tinh-clean-theme in tinh-slides.typ)
      logo:
        location: right-bottom
        width: 0.9cm
        padding: 0.1cm
      lang: de
      # Zitate und Literatur mit Pandoc (Chicago author-date) wie im Skript statt Typsts eigenem Stil
      citeproc: true
      # Zitate als Links auf den Eintrag im Literaturverzeichnis
      link-citations: true
      # Typsts eigene Hervorhebung, damit Codeblöcke raw-Blöcke bleiben (Größe in tinh-slides.typ)
      syntax-highlighting: idiomatic
      # touying-Bridge, eingebettet mit
      # quarto add kazuyanagimoto/quarto-touying-typst --embed tinh-slides
      # Pfade statt Name: die Bridge meldet Filter und Shortcodes nur in ihrem Format an
      shortcodes:
        - _extensions/kazuyanagimoto/touying/shortcodes.lua
      filters:
        - _extensions/kazuyanagimoto/touying/touying.lua
        - _extensions/kazuyanagimoto/touying/environment.lua
      template-partials:
        - _extensions/kazuyanagimoto/touying/typst-template.typ
        - _extensions/kazuyanagimoto/touying/typst-show.typ
      # Befehle aus tinh-slides.typ für environment.lua der Bridge
      commands:
        - neuerbegriff
        - eng
        - inhalt
        - ja
        - nein
        - down5
        - down10
        - down20
        - down30
        - down40
        - down50
        - up5
        - up10
        - up20
        - up30
        - up40
        - up50
      include-in-header:
        - tinh-slides.typ
      theme-typst: tinh-clean-theme
      aspect-ratio: "16-9"
