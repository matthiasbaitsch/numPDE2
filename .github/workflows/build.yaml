name: Render and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-roboto-unhinted

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3

      - name: "Install Julia packages"
        run: julia --project -e 'using Pkg; Pkg.instantiate()'
        working-directory: skripte

      # Environment for executed {julia} cells: copy of the template in the root folder (not checked in), resolved
      # for the Julia version installed here (Quarto stops if it differs from the one in the manifest)
      - name: Julia environment for executed cells
        run: |
          julia skripte/copy-templates.jl
          julia --project=. -e 'using Pkg; Pkg.resolve(); Pkg.instantiate()'

      - name: Render and export PDF
        run: make render

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '__output'

      # Link page of loi-moi with the published URLs, for check-links
      - name: Upload link page
        uses: actions/upload-artifact@v7
        with:
          name: links-site
          path: lernpfad/links-site.html

  deploy:
    needs: render
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
    - name: Setup Pages
      uses: actions/configure-pages@v6
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

  # make check-links on the published pages. The log is public: lychee without --verbose lists only broken links,
  # so the URLs of the solutions (with hash) stay out of it
  check-links:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@v7

    - name: Download link page
      uses: actions/download-artifact@v8
      with:
        name: links-site
        path: lernpfad

    - name: Install lychee
      run: |
        curl -sSL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz \
          | sudo tar -xz -C /usr/local/bin --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee

    - name: Check links
      run: make check-links
